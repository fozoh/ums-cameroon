name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend (flake8)
        run: |
          flake8 backend/students --max-line-length=120 --exclude=migrations

      - name: Run migrations & tests
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py test --verbosity=2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          CI=true npm test -- --watchAll=false
      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Security Audit (npm)
        working-directory: ./frontend
        run: |
          npm audit --audit-level=moderate

      - name: Check for hardcoded secrets
        run: |
          if grep -r --include="*.py" --include="*.js" \
               --exclude-dir=node_modules --exclude-dir=.venv \
               -iE "(password|api.?key|secret|token|aws.secret)" . 2>/dev/null | \
               grep -v ".env.example" | grep -v ".pre-commit" | grep -v "Makefile"; then
            echo "⚠️  Hardcoded secrets detected!"
            exit 1
          else
            echo "✓ No hardcoded secrets found"
          fi
